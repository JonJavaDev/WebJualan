<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pembayaran</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/styles.css" />
  </head>
  <body>
    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>

    <header class="site-header container">
      <a class="btn btn-ghost btn-small" href="Main_Page.html">Kembali ke menu</a>
      <div class="brand">
        <span class="brand-mark">MC</span>
        <div>
          <p class="brand-title">Mie Chili</p>
          <p class="brand-tag">Konfirmasi pembayaran oleh kasir</p>
        </div>
      </div>
    </header>

    <main class="container narrow">
      <section class="panel reveal">
        <div class="panel-head">
          <h1>Pembayaran</h1>
          <p>Ringkasan pesanan. Konfirmasi pembayaran dilakukan di kasir.</p>
        </div>

        <div id="orderSummary" class="summary-grid"></div>

        <div class="payment-grid">
          <div id="qrisPanel" class="payment-card">
            <h3>QRIS (DANA)</h3>
            <p class="muted">Scan QRIS di aplikasi DANA, lalu tunjukkan ke kasir.</p>
            <div class="qr-box">QRIS</div>
            <span id="qrisStatus" class="panel-status">Status</span>
          </div>

          <div id="cashPanel" class="payment-card">
            <h3>Tunai</h3>
            <p class="muted">Serahkan pembayaran tunai ke kasir.</p>
            <span id="cashStatus" class="panel-status">Status</span>
          </div>
        </div>

        <div class="admin-row">
          <button id="refreshStatusBtn" class="btn btn-ghost btn-small" type="button">
            Refresh status
          </button>
          <p id="paymentMessage" class="form-message"></p>
        </div>
      </section>
    </main>

    <script src="assets/shared.js"></script>
    <script src="assets/payment.js"></script>
  </body>
</html>
