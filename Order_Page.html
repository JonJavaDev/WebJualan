<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Buat Pesanan</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/styles.css" />
  </head>
  <body>
    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>

    <header class="site-header container">
      <a class="btn btn-ghost btn-small" href="Main_Page.html">Kembali ke menu</a>
      <div class="brand">
        <span class="brand-mark">MC</span>
        <div>
          <p class="brand-title">Mie Chili</p>
          <p class="brand-tag">Pesan cepat, bayar mudah</p>
        </div>
      </div>
    </header>

    <main class="container narrow">
      <section class="panel reveal">
        <div class="panel-head">
          <h1>Buat Pesanan</h1>
          <p>Isi data pesanan, pilih pembayaran, lalu dapatkan nomor antrian.</p>
        </div>

        <div id="selectedItem" class="item-summary"></div>

        <form id="orderForm" class="form-grid">
          <div class="field">
            <label for="customerName">Nama pemesan</label>
            <input
              id="customerName"
              name="customerName"
              type="text"
              placeholder="Nama kamu"
              required
            />
          </div>

          <div class="field">
            <label for="quantity">Jumlah</label>
            <input
              id="quantity"
              name="quantity"
              type="number"
              min="1"
              value="1"
              required
            />
          </div>

          <div class="field full">
            <span class="label">Metode pembayaran</span>
            <div class="radio-group">
              <label class="radio">
                <input type="radio" name="paymentMethod" value="qris" checked />
                QRIS
              </label>
              <label class="radio">
                <input type="radio" name="paymentMethod" value="cash" />
                Tunai
              </label>
            </div>
            <p class="muted">Bayar saat barang diterima? pilih Tunai.</p>
          </div>

          <div class="field total-field full">
            <span>Total</span>
            <strong id="totalPrice">Rp 0</strong>
          </div>

          <div class="field full">
            <button id="submitOrder" class="btn" type="submit">
              Buat pesanan
            </button>
            <p id="formMessage" class="form-message"></p>
          </div>
        </form>
      </section>
    </main>

    <script src="assets/shared.js"></script>
    <script src="assets/order.js"></script>
  </body>
</html>
