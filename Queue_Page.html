<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Status Pesanan</title>
    <link rel="stylesheet" href="assets/styles.css" />
  </head>
  <body>
    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>

    <header class="site-header container">
      <a class="btn btn-ghost btn-small" href="Main_Page.html">Kembali ke menu</a>
      <div class="brand">
        <img
          class="brand-mark"
          alt="Logo Mie Chili Oil"
          src="logo/mie-chili-logo.svg"
          width="44"
          height="44"
        />
        <div>
          <p class="brand-title">Mie Chili</p>
          <p class="brand-tag">Status pesanan kamu</p>
        </div>
      </div>
    </header>

    <main class="container narrow">
      <section class="panel reveal">
        <div class="panel-head">
          <h1>Status Pesanan</h1>
          <p>Tunjukkan QR ini ke kasir saat mengambil pesanan.</p>
        </div>

        <div id="orderProgress" class="progress-card">
          <div class="progress-header">
            <p class="progress-label">Progres pesanan</p>
            <span class="progress-text" data-progress-text>Menunggu pembayaran</span>
          </div>
          <div class="progress-track">
            <div class="progress-bar"></div>
          </div>
          <div class="progress-steps">
            <div class="progress-step">Pesanan dibuat</div>
            <div class="progress-step">Pembayaran</div>
            <div class="progress-step">Diproses</div>
            <div class="progress-step">Siap diambil</div>
            <div class="progress-step">Selesai</div>
          </div>
        </div>

        <div class="qr-panel">
          <div class="qr-meta">
            <span class="ticket-sub">Kode pesanan</span>
            <div id="orderSequence" class="qr-code-number">-</div>
            <span id="orderStatus" class="muted"></span>
          </div>
          <img id="orderQr" class="qr-image" alt="QR pesanan" />
        </div>

        <div id="queueDetails" class="summary-grid"></div>

        <div class="admin-row">
          <button id="toPaymentBtn" class="btn" type="button">
            Lanjut ke pembayaran
          </button>
          <p id="queueMessage" class="form-message"></p>
        </div>
      </section>
    </main>

    <script src="assets/shared.js"></script>
    <script src="assets/queue.js"></script>
  </body>
</html>
