<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kasir - WebJualan</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/styles.css" />
  </head>
  <body>
    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>

    <header class="site-header container">
      <div class="brand">
        <span class="brand-mark">MC</span>
        <div>
          <p class="brand-title">Kasir Mie Chili</p>
          <p class="brand-tag">Konfirmasi pesanan dan pembayaran</p>
        </div>
      </div>
      <a class="btn btn-ghost btn-small" href="Main_Page.html">Menu</a>
    </header>

    <main class="container narrow">
      <section class="panel reveal">
        <div class="panel-head">
          <h1>Dashboard Kasir</h1>
          <p>Halaman ini hanya untuk PC kasir (butuh admin key).</p>
        </div>

        <div class="admin-panel">
          <div class="admin-row">
            <label class="label" for="adminKey">Admin key</label>
            <input
              id="adminKey"
              type="password"
              placeholder="Masukkan admin key"
              autocomplete="off"
            />
            <button id="saveKeyBtn" class="btn btn-small" type="button">
              Simpan
            </button>
            <button id="clearKeyBtn" class="btn btn-ghost btn-small" type="button">
              Keluar
            </button>
          </div>
          <div class="admin-row">
            <button id="refreshOrdersBtn" class="btn btn-ghost btn-small" type="button">
              Refresh daftar
            </button>
            <p id="adminMessage" class="form-message"></p>
          </div>
        </div>

        <div id="orderList" class="order-list"></div>
      </section>
    </main>

    <script src="assets/shared.js"></script>
    <script src="assets/cashier.js"></script>
  </body>
</html>
